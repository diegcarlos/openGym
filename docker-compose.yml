
name: opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: "1"

    volumes:
      - opengym-data:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped

    depends_on:
      - api

    expose:
      - "80"

    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: ${PORT:-3000}
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}
      BASE_PATH: ""

volumes:
  opengym-data:
    driver: local
